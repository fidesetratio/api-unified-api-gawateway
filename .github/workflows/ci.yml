name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates and drops its own throwaway schema in this database.
      GATEWAY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gateway_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: schema.sql is up to date
        run: go run ./cmd/migrate -sql | diff -u schema.sql -
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build ./...
